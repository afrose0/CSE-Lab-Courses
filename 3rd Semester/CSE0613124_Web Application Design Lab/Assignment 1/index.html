<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1-Space</title>
  <link rel="stylesheet" href="font.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>

<body>
  <div class="container">
    <div class="sidebar"></div>

    <div class="main-content">
      <header>
        <nav class="left-nav">
          <ul>
            <li><a href="#">HOME</a></li>
            <li><a href="#">ABOUT</a></li>
            <li><a href="#">SERVICES</a></li>
          </ul>
        </nav>

        <div class="logo">
          <h1 class="font-axiforma">1-Space</h1>
        </div>

        <nav class="right-nav">
          <ul>
            <li><a href="#">SERVICES</a></li>
            <li><a href="#">SPACES</a></li>
            <li><a href="#">EVENTS</a></li>
          </ul>
        </nav>
      </header>

      <main>
        <div class="hero-section">
          <div class="hero-text">
            <div class="accent-line"></div>
            <h2 class="font-axiforma">A new way to <br> revolutionise <br> your workspace <br> to yourself</h2>

            <div class="location-info">
              <div>
                <i class="fas fa-map-marker-alt"></i>
                <span>City</span>
                <span class="location-divider">Location</span>
              </div>
              <button class="schedule-btn">Schedule Visit</button>
            </div>

            <div class="visitors-info">
              <div class="avatar-group">
                <div class="avatar avatar1"></div>
                <div class="avatar avatar2"></div>
                <div class="avatar avatar3"></div>
                <div class="avatar avatar4"></div>
                <div class="avatar avatar5"></div>
                <div class="avatar avatar6"></div>
                <div class="avatar-plus">+10</div>
              </div>
              <p class="font-axiforma">16 people booked a visit in last 24 hours</p>
            </div>
          </div>

          <div class="hero-image">
            <div class="main-workspace-image">
              <img class="image-main" src="./images/image-right.png" alt="">
              <img class="image-top" src="./images/image-top.png" alt="">
              <div class="circular-image">
                <img class="img1" src="./images/image_1.png" alt="">
              </div>
              <div class="circular-image">
                <img class="img2" src="./images/image_2.png" alt="">
              </div>
              <div class="circular-image">
                <img class="img3" src="./images/image_3.png" alt="">
              </div>
              <div class="vertical-text">Co Working</div>
            </div>
          </div>
        </div>

        <div class="partners">
          <img src="./images/comapnies_logo.png" alt="">
        </div>
      </main>
    </div>
  </div>
</body>

</html>
